# Focus CaseX — static frontend → GitHub Pages
#
# Builds the app as a fully static export (no server) talking directly to
# Supabase (Auth + PostgREST), then publishes it to GitHub Pages.
#
# The Supabase URL + PUBLISHABLE key below are public-safe by design:
# supabase/policies.sql keeps RLS on every table with access only for the
# `authenticated` role, so the key alone can read or write nothing.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static export
        run: bun run build:static
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qdnzpdgytxmtmrerkpew.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_qh2M3iVtI_4FQOHMoXiuOQ_oTceX6-d
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
